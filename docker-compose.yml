services:
  postgres_source:
    image: postgres:15-alpine
    container_name: postgres_source
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio-lakehouse
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: "http://127.0.0.1:9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - postgres_source
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=70"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-lakehouse
    restart: always
    ports:
      - "8123:8123"
      - "9009:9000"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse-low-mem.xml:/etc/clickhouse-server/config.d/low-mem.xml:ro
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

volumes:
  pgdata:
  miniodata:
  chdata:

networks:
  default:
    name: de-network
    external: true